name: Contribution snake

on:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml
      - scripts/contribution-snake.py

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Render the signed-out calendar
        shell: bash
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 30 \
            https://github.com/users/LeoBgn/contributions | python3 scripts/contribution-snake.py
      - name: Publish the refreshed image
        shell: bash
        run: |
          if git diff --quiet -- assets/contribution-snake.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contribution-snake.svg
          git commit -m 'Actualiser le serpent des contributions'
          git push origin HEAD:main
