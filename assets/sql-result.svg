<svg xmlns="http://www.w3.org/2000/svg" width="460" height="116" viewBox="0 0 460 116" role="img" aria-labelledby="title">
  <title id="title">Clients distincts ayant payé en novembre. Web, 2. E-mail, 1.</title>
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
    .email { animation-delay: .13s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <rect x="1" y="1" width="458" height="114" rx="14" fill="#11182C" stroke="#526184" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="18" y="28" fill="#C6D0EB" font-size="12" letter-spacing="1.05">CLIENTS DISTINCTS · NOVEMBRE</text>
    <text x="18" y="58" fill="#F1F5FF" font-size="13">Web</text>
    <text x="18" y="88" fill="#F1F5FF" font-size="13">E-mail</text>
    <rect class="bar" x="94" y="45" width="302" height="15" rx="5" fill="#76EDCF"/>
    <rect class="bar email" x="94" y="75" width="151" height="15" rx="5" fill="#B6A1F4"/>
    <text x="408" y="57" fill="#99F6DE" font-size="14" font-weight="700">2</text>
    <text x="257" y="87" fill="#D2C2FF" font-size="14" font-weight="700">1</text>
  </g>
</svg>
