<svg xmlns="http://www.w3.org/2000/svg" width="896" height="286" viewBox="0 0 896 286" role="img" aria-labelledby="title desc">
  <title id="title">Léo Bugyan · Data science et développement Python</title>
  <desc id="desc">Une commande s’écrit dans un terminal et un graphique apparaît au fil du traitement des données.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#171B33"/>
      <stop offset=".57" stop-color="#10172B"/>
      <stop offset="1" stop-color="#0B2429"/>
    </linearGradient>
    <linearGradient id="border">
      <stop stop-color="#655B9C"/>
      <stop offset="1" stop-color="#356B70"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#65EFCB" stop-opacity=".24"/>
      <stop offset="1" stop-color="#65EFCB" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="504" y="77" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#435473" opacity=".7"/>
    </pattern>
    <clipPath id="typing">
      <rect class="command-mask" x="63" y="175" width="315" height="24"/>
    </clipPath>
    <clipPath id="plot">
      <rect x="510" y="78" width="318" height="116"/>
    </clipPath>
    <path id="series" pathLength="1" d="M511 177 536 165 560 168 584 148 608 153 632 127 656 136 680 111 704 115 728 94 752 109 776 89 801 95 826 80"/>
  </defs>
  <style>
    .command-mask {
      transform-box: fill-box;
      transform-origin: left center;
      animation: type 1.15s steps(20, end) .18s both;
    }
    .step-one { animation: appear .25s ease-out 1.43s both; }
    .step-two { animation: appear .25s ease-out 2.02s both; }
    .step-three { animation: appear .28s ease-out 2.77s both; }
    .trace { stroke-dasharray: 1; animation: draw 1.72s ease-out 1.15s both; }
    .area { animation: appear .65s ease-out 2.35s both; }
    .point { animation: appear .35s ease-out 2.78s both; }
    .ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: ripple .9s ease-out 2 2.95s both;
    }
    .packet { animation: transfer 1.45s ease-in-out 1.33s both; }
    .second-packet { animation-delay: 1.75s; }
    @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes transfer {
      0% { transform: translateX(0); opacity: 0; }
      12%, 84% { opacity: 1; }
      100% { transform: translateX(310px); opacity: 0; }
    }
    @keyframes ripple {
      0% { transform: scale(.7); opacity: .9; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .command-mask, .step-one, .step-two, .step-three, .trace, .area, .point, .ring, .packet {
        animation: none;
      }
    }
  </style>

  <rect x="1" y="1" width="894" height="284" rx="23" fill="url(#background)" stroke="url(#border)" stroke-width="2"/>
  <path d="M2 43H894" stroke="#3B4060"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="25" cy="22" r="4" fill="#D49BE7"/>
    <circle cx="39" cy="22" r="4" fill="#A8A3EF"/>
    <circle cx="53" cy="22" r="4" fill="#6FDFCA"/>
    <text x="75" y="26" fill="#E2DDFC" font-size="12" font-weight="700" letter-spacing="1.3">LEOBGN / PROFILE</text>
    <text x="868" y="26" text-anchor="end" fill="#A8D6D5" font-size="11" letter-spacing="1.25">PYTHON · SQL · DJANGO</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="32" y="119" font-size="63" font-weight="760" letter-spacing="-3.2" fill="#F8F6FF">Léo Bugyan</text>
    <text x="35" y="151" font-size="22" font-weight="620" letter-spacing="-.35" fill="#CBC5F4">Data science &amp; développement Python</text>
  </g>

  <rect x="34" y="173" width="405" height="83" rx="11" fill="#0C1020" stroke="#424B70"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
    <text x="49" y="194" fill="#90F6D5">$</text>
    <text x="65" y="194" fill="#F1ECFF" clip-path="url(#typing)">python analyse.py</text>
    <text class="step-one" x="49" y="217" fill="#A9B7DA">→ Nettoyage et agrégation SQL</text>
    <text class="step-three" x="49" y="238" fill="#90F6D5">✓ Indicateurs prêts pour le tableau de bord</text>
  </g>

  <rect x="468" y="58" width="397" height="198" rx="14" fill="#0F192A" stroke="#3D566B"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
    <text x="488" y="80" fill="#D7D9F3" font-weight="700" letter-spacing="1.15">TABLEAU DE BORD</text>
    <text x="844" y="80" text-anchor="end" fill="#A6B6D5" font-size="10">DONNÉES FICTIVES</text>
  </g>
  <rect x="510" y="91" width="318" height="96" fill="url(#dots)"/>
  <path d="M510 103H828M510 130H828M510 158H828M510 186H828" stroke="#273751"/>
  <g transform="translate(0 15)" clip-path="url(#plot)">
    <path class="area" d="M511 177 536 165 560 168 584 148 608 153 632 127 656 136 680 111 704 115 728 94 752 109 776 89 801 95 826 80V185H511Z" fill="url(#area)"/>
    <use class="trace" href="#series" fill="none" stroke="#75F2CF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <circle class="ring" cx="826" cy="95" r="6" fill="none" stroke="#91FCDD" stroke-width="1.4" opacity="0"/>
  <circle class="point" cx="826" cy="95" r="4.3" fill="#A1FFE1"/>
  <path d="M511 215H821" stroke="#354B69" stroke-width="2"/>
  <circle class="packet" cx="511" cy="215" r="4" fill="#D1B1FF" opacity="0"/>
  <circle class="packet second-packet" cx="511" cy="215" r="3.5" fill="#84F7D7" opacity="0"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle">
    <circle cx="511" cy="215" r="5" fill="#BB9FF4"/>
    <circle class="step-two" cx="664" cy="215" r="5" fill="#A2AFFF"/>
    <circle class="step-three" cx="821" cy="215" r="5" fill="#78E9CD"/>
    <text x="511" y="238" fill="#CAB9F2">CSV</text>
    <text x="664" y="238" fill="#C7D0FC">SQL</text>
    <text x="821" y="238" fill="#9DEED7">Indicateurs</text>
  </g>
</svg>
